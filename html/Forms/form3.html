<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Project</title>
</head>
<body>
    
    <h1>Event Registration</h1>
    
    <form>

    <label for="Name">Name :</label>
    <input type="text" id="Name">
    
    <br>

    <label for="Email">Email :</label>
    <input type="email" id="Email">

    <br>
    
    <label for="tel">Phone :</label>
    <input type="tel" id="tel">

    <br>

    <label for="Occupation">Occupation</label>
    <select name="Occupation" id="Occupation">
        <option value="Private Sector">Priavte Sector</option>
        <option value="Public sector">Public Sector</option>
        <option value="Self Occupied">Self Occupied</option>
    </select>
    
    <br>

    <label for="Intrest">Topic of interest: </label>

    <label for="Intrest">HTML</label>
    <input type="checkbox" id="Intrest">

    <label for="Intrest">CSS</label>
    <input type="checkbox" id="Intrest">

    <label for="Intrest">Js</label>
    <input type="checkbox" id="Intrest">
    
    <br>

    <label for="Comments">Comments:</label>
    <br>
    <textarea name="Comments" id="Comments" rows="8" cols="50"></textarea>
    <button>Submit</button>
    <input type="button" value="Submit">

</form>
</body>
</html>

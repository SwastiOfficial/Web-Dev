<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Job Application</h1>
    <form action>
    
     <label for="Name">Name: </label>
     <input type="text" id="Name" name="Name">
     <br>
     <label for="Email">Email</label>
     <input type="email" id="Email" name="Email">
     <br>
     <label for="Phone">Phone</label>
     <input type="tel" id="Phone" name="Phone">
     <br>
     <label for="Resume">Resume: </label>
     <input type="file" id="Resume" name="Resume">
     <br>
     <label for="Expierence">Expierence (years) :</label>
     <input type="number" id="Expierence" name="counter" min="1" max="40">
     <select name="Expierence" id="Expierence">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4+">4+</option>
     </select>

     <br>
    
     <fieldset>
       <legend>Skills :</legend>
        
       <input type="checkbox" id="HTML" name="HTML">
       <br>
       <label for="checkbox">HTML</label>

       <br>

       <input type="checkbox" id="CSS" name="CSS">
       <br>
       <label for="checkbox">CSS</label>

       <br>

       <input type="checkbox" id="JS" name="JS">
       <br>
       <label for="checkbox">JS</label>

     </fieldset>

     <label for="Highest Education">Highest Education</label>
     <select name="Highest Education" id="Highest Education" name="Highest Education">
        <option value="High school">High School</option>
        <option value="intermediate">intermediate</option>
        <option value="graduation">Graduation</option>
        <option value=" post graduation"> Post Graduation</option>
     </select>

    <br>
    <br>

     <label for="Availability">Availabilty :</label>
     <br>
     <label for="Full time">Full Time</label>
     <input type="radio" id="Full Time" name="Availability">
     <br>
     <label for="Part time">Part Time</label>
     <input type="radio" id="Part Time" name="Availability">
      
     <br>

     <label for="Comments"> Additional Comments :</label>
     <textarea name="Comments" rols="3" cols="20" id="Comments"></textarea>


    </form>
</body>
</html>

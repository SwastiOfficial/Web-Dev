<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Complex Forms</h1>
    <form>

     <fieldset>

        <legend>Personal Information</legend>

        <label for="Name">Name: </label>
        <input type="text" id="Name" name="Name">

        <label for="Email">Email: </label>
        <input type="email" id="Email" name="Email">

        <label for="Phone">Phone : </label>
        <input type="tel" id="Phone" name="Phone">

        <label for="DOB">Date of Birth: </label>
        <input type="date" id="DOB" name="DOB">

        <label for="Gender">Gender: </label>

        <label for="Female">Female</label>
        <input type="radio" id="Female" name="Gender">

        <label for="Male">Male</label>
        <input type="radio" id="Female" name="Gender">

        <label for="Country"> Country: </label>
        <select name="Country" id="Country" name="Country">
        
            <option value="USA">USA</option>
            <option value="India">India</option>
            <option value="France">France</option>
            <option value="China">China</option>

        </select>

     </fieldset>

     <fieldset>
        <legend>
            <label for="Adress Street">Adress Street</label>
            <input type="text" id="Adress Street" name="Adress Street">

            <label for="City">City</label>
            <input type="text" id="City" name="City">

            <label for="State">State</label>
            <input type="text" id="State" name="State">

            <label for="Zip Code">Zip Code</label>
            <input type="text" id="Zip Code" name="Zip Code">

      </legend>
     </fieldset>

     <fieldset>
        <legend>
            Other Information
        </legend>

        <label for="Comments">Comments</label>
        <textarea name="Comments" id="Comments" name="Comments" rols="6" cols="30"></textarea>

        <label for="Terms">I agree to Terms and Conditions</label>
        <input type="checkbox" id="Terms" name="Terms">
     </fieldset>
    <button>Submit</button>
    </form>
</body>
</html>
